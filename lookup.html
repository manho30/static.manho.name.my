<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>static.manho.name.my</title>

    <style>
        body {
            font-family: monospace;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        a {
            text-decoration: none;
        }

        .file {
            padding: 6px 0;
        }

        .folder {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>static.manho.name.my</h1>

<div id="files">Loading...</div>

<script>
    fetch("/manifest.json")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("files");

            data.files.forEach(file => {
                const div = document.createElement("div");
                div.className = "file";

                const link = document.createElement("a");
                link.href = "/" + file;
                link.textContent = file;

                div.appendChild(link);
                container.appendChild(div);
            });
        })
        .catch(() => {
            document.getElementById("files").textContent =
                "Unable to load file list.";
        });
</script>

</body>
</html>
