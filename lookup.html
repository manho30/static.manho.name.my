<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading...</title>

    <style>
        body {
            font-family: monospace;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        a {
            color: #06c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .meta {
            color: #666;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 5px 8px;
            font-family: monospace;
        }

        .item {
            padding: 6px 0;
        }

        small {
            word-break: break-all;
        }
    </style>
</head>

<body>

<h1>static.manho.name.my</h1>

<div id="updated" class="meta"></div>

<div class="controls">
    <input id="search" type="search" placeholder="Search files...">

    <select id="sort">
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
        <option value="type">File Type</option>
    </select>
</div>

<div id="path"></div>
<div id="files">Loading...</div>

<script>
    document.title = location.hostname;

    let files = [];
    let query = "";
    let sort = "name-asc";

    const $ = id => document.getElementById(id);

    async function load() {
        const res = await fetch("/manifest.json?t=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        files = Array.isArray(data) ? data : data.files;

        if (!Array.isArray(files))
            throw new Error("Invalid manifest");

        if (data.updated_at) {
            $("updated").textContent =
                "Last updated: " +
                new Date(data.updated_at).toLocaleString(undefined, {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: false
                });
        }

        render();
    }

    function render() {
        const path = location.hash
            .replace(/^#\/?/, "")
            .replace(/\/?$/, "");

        const current = path ? path + "/" : "";
        const folders = new Set();
        let list = [];

        files
            .filter(f => !query || f.toLowerCase().includes(query))
            .forEach(file => {
                if (!file.startsWith(current)) return;

                const rest = file.slice(current.length);
                if (!rest) return;

                const parts = rest.split("/");

                if (parts.length > 1)
                    folders.add(parts[0]);
                else
                    list.push(file);
            });

        list.sort((a, b) => {
            const A = a.split("/").pop().toLowerCase();
            const B = b.split("/").pop().toLowerCase();

            if (sort === "name-desc")
                return B.localeCompare(A);

            if (sort === "type") {
                const ext = x => x.split(".").pop();
                return ext(A).localeCompare(ext(B)) ||
                    A.localeCompare(B);
            }

            return A.localeCompare(B);
        });

        $("path").innerHTML = `<p>/${current}</p>`;

        const out = [];

        if (current) {
            const parent = current.split("/").slice(0, -2).join("/");
            out.push(
                `<div class="item">⬅️ <a href="#/${parent ? parent + "/" : ""}">..</a></div>`
            );
        }

        [...folders].sort().forEach(folder => {
            out.push(
                `<div class="item">📁 <a href="#/${current}${folder}/">${folder}/</a></div>`
            );
        });

        list.forEach(file => {
            const name = file.split("/").pop();
            const url = `https://static.manho.name.my/${file}`;

            out.push(`
                <div class="item">
                    📄 <a href="/${file}" target="_blank">${name}</a><br>
                    <small>
                        ${url}
                        <a href="#" onclick="copyUrl(event, '${url}')">[copy]</a>
                    </small>
                </div>
            `);
        });

        $("files").innerHTML =
            out.join("") ||
            (query ? "No matching files." : "Empty directory.");
    }

    function copyUrl(event, url) {
        event.preventDefault();

        navigator.clipboard.writeText(url);

        const link = event.target;
        link.textContent = "[copied!]";
        link.style.color = "red";

        setTimeout(() => {
            link.textContent = "[copy]";
        }, 1500);
    }

    $("search").oninput = e => {
        query = e.target.value.toLowerCase().trim();
        render();
    };

    $("sort").onchange = e => {
        sort = e.target.value;
        render();
    };

    window.onhashchange = render;

    load().catch(error => {
        console.error(error);
        $("files").textContent = "Unable to load file list.";
    });
</script>

</body>
</html>
