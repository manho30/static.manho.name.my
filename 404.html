<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
</head>
<body>
<pre id="json"></pre>

<script>
    document.getElementById("json").textContent = JSON.stringify({
        error: "Not Found",
        status: 404,
        message: "The requested resource does not exist."
    }, null, 2);
</script>
</body>
</html>
